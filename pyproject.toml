[project]
name = "face-geometry-leakage"
version = "0.1.0"
description = "Do facial landmark geometry features (angles, distances, blendshapes) leak identity? A privacy audit and defence study."
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "MIT" }
authors = [{ name = "Rupesh Bharambe" }]
dependencies = [
    "mediapipe>=0.10.14",
    "numpy",
    "scipy",
    "pandas",
    "pyarrow",
    "scikit-learn>=1.4",
    "matplotlib",
    "pyyaml",
    "tabulate",
    "tqdm",
    "opencv-python-headless",
    "torch>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff"]

[project.scripts]
fgl = "fgl.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fgl"]

# CUDA build of PyTorch on Windows/Linux (RTX 30xx works with CUDA 12.6);
# macOS falls back to the default PyPI wheel (CPU/MPS).
[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu126", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
